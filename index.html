<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W.D.W. | Worldwide Drug Wars</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090909;
    color: #f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

#app {
    min-height: 100vh;
}

.screen {
    display: none;
    min-height: 100vh;
    padding: 20px;
}

.screen.active {
    display: block;
}

.menu {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    padding-top: 7vh;
}

.logo {
    font-size: clamp(42px, 10vw, 90px);
    font-weight: 900;
    letter-spacing: 8px;
    color: #39ff14;
    text-shadow:
        0 0 8px #39ff14,
        0 0 20px #39ff14;
}

.subtitle {
    color: #bbb;
    letter-spacing: 4px;
    margin-bottom: 45px;
}

.panel {
    background: #111;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin: 15px auto;
    box-shadow: 0 0 25px rgba(0,0,0,.5);
}

.menu button {
    display: block;
    width: min(450px, 100%);
    margin: 12px auto;
    padding: 15px;
    border: 1px solid #39ff14;
    background: #101510;
    color: #39ff14;
    border-radius: 8px;
    font-weight: bold;
}

.menu button:hover {
    background: #39ff14;
    color: #000;
}

.top10 {
    text-align: left;
}

.top10 h2 {
    text-align: center;
    color: #39ff14;
}

.score-row {
    display: grid;
    grid-template-columns: 55px 1fr 130px;
    gap: 10px;
    padding: 9px;
    border-bottom: 1px solid #222;
}

.game-wrap {
    max-width: 1200px;
    margin: auto;
}

.header {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.stat {
    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
}

.stat-label {
    display: block;
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
}

.stat-value {
    display: block;
    margin-top: 4px;
    font-weight: bold;
}

.market {
    background: #111;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
}

.market-title {
    padding: 15px;
    background: #151515;
    border-bottom: 1px solid #333;
    font-size: 20px;
    font-weight: bold;
}

.market-row {
     display: flex;
     align-items: center;
     justify-content: space-between;
     min-height: 56px;
     padding: 0 14px;
     border-bottom: 1px solid #292929;
     background: transparent;
     cursor: pointer;
     transition: background .12s ease;
 }

.market-row:hover { background: #171717; }
.market-row:active { background: #202020; }

.market-name {
     font-size: 18px;
     font-weight: 500;
     white-space: nowrap;
     overflow: hidden;
     text-overflow: ellipsis;
 }

.market-price {
     font-size: 18px;
     font-weight: 600;
     margin-left: 14px;
     white-space: nowrap;
 }

.market-price.hot { color: #ff4b3e; }
.market-price.cheap { color: #7bdc3f; }

.market-row:last-child {
    border-bottom: 0;
}

.price {
    color: #39ff14;
    font-weight: bold;
}

.controls {
    display: flex;
    gap: 7px;
    align-items: center;
}

.controls button {
    width: 38px;
    height: 34px;
    border: 1px solid #444;
    border-radius: 5px;
    background: #1b1b1b;
    color: white;
}

.controls button:hover {
    background: #333;
}

.controls input {
    width: 60px;
    text-align: center;
    background: #080808;
    border: 1px solid #444;
    color: white;
    padding: 7px;
}

.action-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.action-bar button {
    padding: 13px;
    border: 1px solid #444;
    background: #151515;
    color: white;
    border-radius: 7px;
}

.action-bar button:hover {
    border-color: #39ff14;
    color: #39ff14;
}

.message {
    min-height: 65px;
    margin-top: 15px;
    background: #101010;
    border-left: 4px solid #39ff14;
    padding: 15px;
    border-radius: 5px;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
}

.modal.active {
    display: flex;
}

.modal-box {
    width: min(600px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #111;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 25px;
}

.modal-box h2 {
    color: #39ff14;
}

.modal-box button {
    margin-top: 10px;
    padding: 11px 18px;
    background: #191919;
    border: 1px solid #555;
    color: white;
    border-radius: 6px;
}

.modal-box button:hover {
    border-color: #39ff14;
    color: #39ff14;
}

input,
select {
    background: #090909;
    border: 1px solid #444;
    color: white;
    padding: 10px;
    border-radius: 6px;
    width: 100%;
    margin: 7px 0 15px;
}

label {
    color: #aaa;
    font-size: 13px;
}

.location-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
}

.location-list button {
    text-align: left;
}

.bank-amount {
    font-size: 25px;
    color: #39ff14;
    margin: 10px 0;
}

.danger {
    color: #ff5555;
}

.good {
    color: #39ff14;
}

@media (max-width: 700px) {
    .header {
        grid-template-columns: repeat(3, 1fr);
    }
     .market-row {
         min-height: 52px;
         padding: 0 10px;
     }

     .market-name,
     .market-price {
         font-size: 17px;
     }

    .action-bar {
        grid-template-columns: repeat(2, 1fr);
    }

    .logo {
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- MAIN MENU -->
    <section id="menuScreen" class="screen active">
        <div class="menu">

            <div class="logo">W.D.W.</div>

            <div class="subtitle">
                WORLDWIDE DRUG WARS
            </div>

            <div class="panel">
                <div class="top10">
                    <h2>GLOBAL TOP 10</h2>

                    <div id="top10">
                        <div class="score-row">
                            <b>#</b>
                            <b>PLAYER</b>
                            <b>SCORE</b>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="showStart()">PLAY</button>
            <button onclick="showLeaderboard()">FULL LEADERBOARD</button>
            <button onclick="showHowToPlay()">HOW TO PLAY</button>
            <button onclick="showSettings()">SETTINGS</button>

        </div>
    </section>

    <!-- START SCREEN -->
    <section id="startScreen" class="screen">
        <div class="menu">

            <div class="logo" style="font-size:50px;">W.D.W.</div>

            <div class="panel">

                <h2>START NEW GAME</h2>

                <label>PLAYER NAME</label>
                <input id="playerName" maxlength="16" placeholder="Enter your name">

                <label>GAME LENGTH</label>
                <select id="gameLength">
                    <option value="30">30 DAYS</option>
                    <option value="60">60 DAYS</option>
                    <option value="90">90 DAYS</option>
                    <option value="180">180 DAYS</option>
                    <option value="365">1 YEAR</option>
                    <option value="730">2 YEARS</option>
                    <option value="1095">3 YEARS</option>
                    <option value="1460">4 YEARS</option>
                    <option value="1825">5 YEARS</option>
                </select>

                <label>STARTING LOCATION</label>
                <select id="startingLocation"></select>

                <button onclick="startGame()">START GAME</button>
                <button onclick="showScreen('menuScreen')">BACK</button>

            </div>
        </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="gameScreen" class="screen">

        <div class="game-wrap">

            <div class="header">

                <div class="stat">
                    <span class="stat-label">Location</span>
                    <span class="stat-value" id="statLocation"></span>
                </div>

                <div class="stat">
                    <span class="stat-label">Day</span>
                    <span class="stat-value" id="statDay"></span>
                </div>

                <div class="stat">
                    <span class="stat-label">Visits</span>
                    <span class="stat-value" id="statVisits"></span>
                </div>

                <div class="stat">
                    <span class="stat-label">Cash</span>
                    <span class="stat-value" id="statCash"></span>
                </div>

                <div class="stat">
                    <span class="stat-label">Bank</span>
                    <span class="stat-value" id="statBank"></span>
                </div>

                <div class="stat">
                    <span class="stat-label">Health</span>
                    <span class="stat-value" id="statHealth"></span>
                </div>

            </div>

            <div class="stat" style="margin-bottom:15px;">
                <span class="stat-label">Pocket Capacity</span>
                <span class="stat-value" id="statCapacity"></span>
            </div>

            <div class="market">

                <div class="market-title">
                    MARKET
                </div>

                <div id="marketRows"></div>

            </div>

            <div class="action-bar">

                <button onclick="openTravel()">
                    ✈ TRAVEL
                </button>

                <button onclick="openBank()">
                    🏦 BANK
                </button>

                <button onclick="openHospital()">
                    🏥 HOSPITAL
                </button>

                

            </div>

            <div class="message" id="message">
                Welcome to Worldwide Drug Wars.
            </div>

        </div>

    </section>

    <!-- LEADERBOARD -->
    <section id="leaderboardScreen" class="screen">

        <div class="menu">

            <div class="logo" style="font-size:50px;">
                GLOBAL LEADERBOARD
            </div>

            <div class="panel">

                <div id="leaderboardRows"></div>

            </div>

            <button onclick="showScreen('menuScreen')">
                BACK
            </button>

        </div>

    </section>

    <!-- MODAL -->
    <div id="modal" class="modal">

        <div class="modal-box" id="modalContent"></div>

    </div>

</div>

<script>
/* =========================================================
   W.D.W. WORLDWIDE DRUG WARS
   Cleaned single-player game engine
   ========================================================= */

const LOCATIONS = [
  { country: "Canada", city: "Toronto", districts: ["Downtown","Kensington","Yorkville","The Junction","Harbourfront"] },
  { country: "Canada", city: "Windsor", districts: ["Downtown","Walkerville","Ford City","Riverside","West End","East End"] },
  { country: "Canada", city: "Montreal", districts: ["Old Montreal","Downtown","Plateau","Mile End","Griffintown"] },
  { country: "Canada", city: "Vancouver", districts: ["Downtown","Gastown","Kitsilano","Commercial Drive","Waterfront"] },
  { country: "Canada", city: "Vancouver Island", districts: ["Downtown","Sooke","Langford","Jordan River","Campbell River"] },
  { country: "USA", city: "New York", districts: ["Manhattan","Brooklyn","Queens","Bronx","Harlem"] },
  { country: "USA", city: "Chicago", districts: ["The Loop","Wicker Park","Hyde Park","Pilsen","River North"] },
  { country: "USA", city: "Los Angeles", districts: ["Downtown","Hollywood","Venice","Koreatown","Echo Park"] },
  { country: "USA", city: "Las Vegas", districts: ["The Strip","Downtown","Fremont","Arts District","Paradise"] },
  { country: "UK", city: "London", districts: ["Soho","Camden","Shoreditch","Westminster","Brixton"] },
  { country: "France", city: "Paris", districts: ["Montmartre","Le Marais","Latin Quarter","Bastille","Belleville"] },
  { country: "Germany", city: "Berlin", districts: ["Mitte","Kreuzberg","Neukolln","Prenzlauer Berg","Friedrichshain"] },
  { country: "Netherlands", city: "Amsterdam", districts: ["Centrum","Jordaan","De Pijp","Oost","Noord"] },
  { country: "Japan", city: "Tokyo", districts: ["Shibuya","Shinjuku","Akihabara","Ginza","Harajuku"] },
  { country: "Australia", city: "Sydney", districts: ["CBD","Surry Hills","Newtown","The Rocks","Darling Harbour"] },
  { country: "Brazil", city: "Rio de Janeiro", districts: ["Centro","Copacabana","Ipanema","Lapa","Botafogo"] },
  { country: "Mexico", city: "Mexico City", districts: ["Centro","Roma","Condesa","Polanco","Coyoacan"] },
  { country: "South Africa", city: "Cape Town", districts: ["City Bowl","Woodstock","Camps Bay","Observatory","Waterfront"] },
  { country: "UAE", city: "Dubai", districts: ["Downtown","Deira","Marina","Jumeirah","Bur Dubai"] }
];

const ITEMS = [
  { name: "Weed", min: 80, max: 850 },
  { name: "Hash", min: 150, max: 6000 },
  { name: "Acid", min: 113, max: 8000 },
  { name: "Cocaine", min: 1216, max: 90000 },
  { name: "Hashish", min: 23, max: 1203 },
  { name: "Heroin", min: 1279, max: 100000 },
  { name: "Ludes", min: 10, max: 100 },
  { name: "MDA", min: 96, max: 6896 },
  { name: "Opium", min: 692, max: 100000 },
  { name: "PCP", min: 407, max: 10000 },
  { name: "Peyote", min: 224, max: 2240 },
  { name: "Fentanyl", min: 4500, max: 18000 },
  { name: "GHB", min: 150, max: 7500 },
  { name: "Viagra", min: 40, max: 250 },
  { name: "Meth", min: 800, max: 4500 },
  { name: "Ketamine", min: 300, max: 18000 },
  { name: "Xanax", min: 50, max: 400 },
  { name: "Ecstasy", min: 400, max: 5000 },
  { name: "Crack", min: 1200, max: 65000 },
  { name: "DMT", min: 900, max: 7000 }
];

let game = null;

const LEADERBOARD_KEY = "wdwLeaderboard";
const SETTINGS_KEY = "wdwSettings";
const SAVED_GAME_KEY = "wdwSavedGame";

let settings = loadSettings();

function storageGet(key, fallback = null) {
  try { return localStorage.getItem(key) ?? fallback; }
  catch { return fallback; }
}

function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch { return false; }
}

function storageRemove(key) {
  try { localStorage.removeItem(key); } catch { /* storage unavailable */ }
}

function newGameState(name, length, location) {
  return {
    username: name,
    gameLength: length,
    day: 1,
    visits: 0,
    maxVisits: 5,
    cash: 2000,
    bank: 0,
    health: 100,
    capacity: 100,
    inventory: {},
    location,
    prices: {},
    gameOver: false
  };
}

function money(value) {
  return "$" + Math.max(0, Math.floor(Number(value) || 0)).toLocaleString();
}

function random(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function chance(percent) {
  return Math.random() * 100 < percent;
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => screen.classList.remove("active"));
  const screen = document.getElementById(id);
  if (screen) screen.classList.add("active");
}

function message(text) {
  const el = document.getElementById("message");
  if (el) el.innerHTML = text;
}

function locationName(location) {
  if (!location) return "Unknown";
  return `${location.city}, ${location.country} • ${location.district}`;
}

function createLocation(location) {
  return {
    country: location.country,
    city: location.city,
    district: location.district || location.districts[random(0, location.districts.length - 1)],
    districts: [...location.districts]
  };
}

function inventoryCount() {
  if (!game?.inventory) return 0;
  return Object.values(game.inventory).reduce((total, amount) => total + (Number(amount) || 0), 0);
}

function getInventoryTotal() {
  return inventoryCount();
}

function generateMarket() {
  if (!game) return;
  game.prices = {};
  ITEMS.forEach(item => {
    let price = random(item.min, item.max);
    if (chance(12)) price *= random(150, 250) / 100;
    if (chance(12)) price *= random(35, 70) / 100;
    game.prices[item.name] = Math.max(10, Math.floor(price));
  });
}

function renderMarket() {
  const container = document.getElementById("marketRows");
  if (!container || !game) return;
  container.innerHTML = "";

  ITEMS.forEach(item => {
    const price = game.prices[item.name] || 0;
    const midpoint = (item.min + item.max) / 2;
    const ratio = midpoint > 0 ? price / midpoint : 1;
    const priceClass = ratio >= 1.45 ? "hot" : (ratio <= 0.55 ? "cheap" : "");
    const row = document.createElement("div");
    row.className = "market-row";
    row.setAttribute("role", "button");
    row.setAttribute("tabindex", "0");
    row.setAttribute("aria-label", `${item.name}, ${money(price)}. Tap to buy or sell.`);
    row.innerHTML = `
      <span class="market-name">${escapeHtml(item.name)}</span>
      <span class="market-price ${priceClass}">${money(price)}</span>`;
    row.addEventListener("click", () => openTrade(item.name));
    row.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openTrade(item.name);
      }
    });
    container.appendChild(row);
  });
}

function openTrade(itemName) {
  if (!game || game.gameOver) return;
  const item = ITEMS.find(entry => entry.name === itemName);
  if (!item) return;

  const price = game.prices[itemName] || 0;
  const owned = game.inventory[itemName] || 0;
  const freeSpace = Math.max(0, game.capacity - inventoryCount());

  openModal(`
    <h2>${escapeHtml(itemName)}</h2>
    <p>Market price: <strong>${money(price)}</strong></p>
    <p>Carrying: <strong>${owned}</strong> &nbsp; Pocket space: <strong>${freeSpace}</strong></p>
    <label for="tradeQty">Quantity</label>
    <input id="tradeQty" type="number" min="1" step="1" value="1" inputmode="numeric" style="width:100%;padding:11px;margin-top:6px;background:#080808;border:1px solid #444;color:white;border-radius:6px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
      <button type="button" onclick="tradeFromModal('buy', ${JSON.stringify(itemName)})">BUY</button>
      <button type="button" onclick="tradeFromModal('sell', ${JSON.stringify(itemName)})">SELL</button>
    </div>
    <button type="button" onclick="closeModal()">CLOSE</button>
  `);
}

function tradeFromModal(action, itemName) {
  const input = document.getElementById("tradeQty");
  const quantity = input ? Math.max(0, Math.floor(Number(input.value) || 0)) : 0;
  if (quantity <= 0) return message("Choose a quantity greater than zero.");

  const price = game.prices[itemName];
  if (!Number.isFinite(price)) return message("That item is not available at this market.");

  if (action === "buy") {
    const available = game.capacity - inventoryCount();
    if (quantity > available) return message(`You only have ${available} pocket spaces left.`);
    const total = price * quantity;
    if (total > game.cash) return message("You don't have enough cash.");
    game.cash -= total;
    game.inventory[itemName] = (game.inventory[itemName] || 0) + quantity;
    closeModal();
    message(`Bought ${quantity} ${escapeHtml(itemName)} for ${money(total)}.`);
  } else {
    const owned = game.inventory[itemName] || 0;
    if (quantity > owned) return message(`You only have ${owned} units to sell.`);
    const total = price * quantity;
    game.inventory[itemName] = owned - quantity;
    game.cash += total;
    closeModal();
    message(`Sold ${quantity} ${escapeHtml(itemName)} for ${money(total)}.`);
  }

  updateGame();
}

function changeQuantity(item, amount) {
  const input = document.getElementById("qty-" + item);
  if (!input) return;
  input.value = Math.max(0, (Number(input.value) || 0) + amount);
}

function getQuantity(itemName) {
  const input = document.getElementById("qty-" + itemName);
  if (!input) return 0;
  const quantity = Number(input.value);
  return Number.isFinite(quantity) ? Math.max(0, Math.floor(quantity)) : 0;
}

function buy(itemName) {
  if (!game || game.gameOver) return;
  const quantity = getQuantity(itemName);
  if (quantity <= 0) return message("Choose how many units you want to buy.");

  const available = game.capacity - inventoryCount();
  if (quantity > available) return message(`You only have ${available} pocket spaces left.`);

  const price = game.prices[itemName];
  if (!Number.isFinite(price)) return message("That item is not available at this market.");
  const total = price * quantity;
  if (total > game.cash) return message("You don't have enough cash.");

  game.cash -= total;
  game.inventory[itemName] = (game.inventory[itemName] || 0) + quantity;
  const input = document.getElementById("qty-" + itemName);
  if (input) input.value = 0;
  message(`Bought ${quantity} ${escapeHtml(itemName)} for ${money(total)}.`);
  updateGame();
}

function sell(itemName) {
  if (!game || game.gameOver) return;
  const quantity = getQuantity(itemName);
  const owned = game.inventory[itemName] || 0;
  if (quantity <= 0) return message("Choose how many units you want to sell.");
  if (quantity > owned) return message(`You only have ${owned} ${escapeHtml(itemName)}.`);

  const price = game.prices[itemName];
  if (!Number.isFinite(price)) return message("That item is not available at this market.");
  const total = price * quantity;
  game.cash += total;
  game.inventory[itemName] -= quantity;
  const input = document.getElementById("qty-" + itemName);
  if (input) input.value = 0;
  message(`Sold ${quantity} ${escapeHtml(itemName)} for ${money(total)}.`);
  updateGame();
}

function openTravel() {
  if (!game || game.gameOver) return;
  if (game.visits >= game.maxVisits) return message("You have no visits remaining today.");

  const buttons = LOCATIONS.map((location, index) => {
    const current = location.city === game.location.city && location.country === game.location.country;
    return `<button type="button" onclick="travelTo(${index})" ${current ? "disabled" : ""}>
      ${escapeHtml(location.city)}, ${escapeHtml(location.country)} ${current ? "(CURRENT)" : ""}
    </button>`;
  }).join("");

  openModal(`<h2>✈ TRAVEL</h2><p>Choose your next destination. Every move uses one visit.</p><div class="location-list">${buttons}</div><button type="button" onclick="closeModal()">CANCEL</button>`);
}

function travelTo(locationIndex) {
  if (!game || game.gameOver) return;
  if (game.visits >= game.maxVisits) {
    message("You have no visits remaining today.");
    closeModal();
    return;
  }

  const destination = LOCATIONS[locationIndex];
  if (!destination) return;
  if (destination.city === game.location.city && destination.country === game.location.country) {
    message("You are already in that location.");
    return;
  }

  const international = destination.country !== game.location.country;
  const travelCost = international ? random(250, 1800) : random(10, 150);
  if (travelCost > game.cash) return message(`You need ${money(travelCost)} for this trip.`);

  game.cash -= travelCost;
  game.location = createLocation(destination);
  game.visits += 1;
  generateMarket();
  closeModal();
  message(`✈ Travelled to <strong>${escapeHtml(locationName(game.location))}</strong>.<br>Travel cost: ${money(travelCost)}`);
  updateGame();

  const policeChance = international ? 15 : 7;
  if (chance(policeChance)) {
    setTimeout(policeEncounter, 400);
  } else if (chance(20)) {
    setTimeout(randomEvent, 400);
  }

  finishVisit();
}

function policeEncounter() {
  if (!game || game.gameOver) return;
  openModal(`<h2 class="danger">🚨 POLICE ENCOUNTER</h2><p>An officer has spotted you.</p><p>What do you do?</p><button type="button" onclick="runFromPolice()">🏃 RUN</button><button type="button" onclick="fightPolice()">👊 FIGHT</button>`);
}

function runFromPolice() {
  closeModal();
  if (chance(62)) message("You managed to get away before they could stop you.");
  else busted();
  updateGame();
}

function fightPolice() {
  closeModal();
  if (chance(48)) {
    const damage = random(8, 25);
    game.health = Math.max(1, game.health - damage);
    message(`You fought your way out.<br>You lost ${damage} health.`);
  } else {
    busted();
  }
  updateGame();
}

function busted() {
  if (!game) return;
  const cashLoss = Math.min(game.cash, Math.floor(game.cash * random(20, 70) / 100));
  game.cash -= cashLoss;
  let stashLoss = 0;

  Object.keys(game.inventory).forEach(item => {
    if (game.inventory[item] > 0 && chance(65)) {
      const loss = Math.max(1, Math.floor(game.inventory[item] * random(20, 70) / 100));
      game.inventory[item] -= Math.min(loss, game.inventory[item]);
      stashLoss += loss;
    }
  });

  message(`<strong class="danger">BUSTED!</strong><br>Police confiscated ${money(cashLoss)} and ${stashLoss} units of your stash.<br><br>Your bank account was untouched.`);
  updateGame();
}

function randomEvent() {
  if (!game || game.gameOver) return;

  const events = [
    { weight: 10, run: () => marketEvent("🚨 HUGE RAID", random(25, 80), true, "Authorities raided several major") },
    { weight: 10, run: () => marketEvent("📉 MARKET FLOOD", random(25, 70), false, "A huge shipment of") },
    { weight: 8, run: () => marketEvent("📈 SUDDEN DEMAND", random(40, 120), true, "Demand for") },
    { weight: 8, run: () => marketEvent("🚚 SUPPLY SURGE", random(20, 60), false, "An unexpected shipment of") },
    { weight: 7, run: () => marketEvent("🔥 SHORTAGE", random(30, 90), true, "Supplies of") },
    { weight: 7, run: () => marketEvent("📰 BAD BATCH", random(20, 55), false, "Reports of contaminated") },
    { weight: 6, run: () => marketEvent("🌐 INTERNATIONAL CRISIS", random(50, 150), true, "International supply problems have disrupted the") },
    { weight: 6, run: () => marketEvent("🛃 BORDER CRACKDOWN", random(30, 80), false, "Increased inspections have disrupted the") },
    { weight: 5, run: () => {
      const item = ITEMS[random(0, ITEMS.length - 1)];
      const amount = random(1, 4);
      const room = game.capacity - inventoryCount();
      if (room <= 0) {
        const cash = random(50, 250);
        game.cash += cash;
        return `🎒 You found a package, but your pockets are full.<br><br>You sold it for ${money(cash)}.`;
      }
      const found = Math.min(amount, room);
      game.inventory[item.name] = (game.inventory[item.name] || 0) + found;
      return `🎒 RANDOM FIND<br>You found ${found} unit${found === 1 ? "" : "s"} of ${escapeHtml(item.name)}.`;
    }},
    { weight: 4, run: () => {
      const amount = random(100, 600);
      game.cash += amount;
      return `💵 LUCKY BREAK<br>You found ${money(amount)} tucked away in an abandoned bag.`;
    }},
    { weight: 4, run: () => {
      const amount = Math.min(game.cash, random(50, 500));
      if (amount <= 0) return `🥷 ROBBERY ATTEMPT<br>Someone tried to rob you, but you had no cash worth taking.`;
      game.cash -= amount;
      return `🥷 ROBBED<br>Someone caught you off guard and took ${money(amount)}.<br><br>Your bank money is safe.`;
    }}
  ];

  const total = events.reduce((sum, event) => sum + event.weight, 0);
  let roll = Math.random() * total;
  let selected = events[events.length - 1];
  for (const event of events) {
    roll -= event.weight;
    if (roll <= 0) { selected = event; break; }
  }
  message(selected.run());
  updateGame();
}

function marketEvent(title, change, increase, lead) {
  const item = ITEMS[random(0, ITEMS.length - 1)];
  const multiplier = increase ? 1 + change / 100 : 1 - change / 100;
  game.prices[item.name] = Math.max(10, Math.floor((game.prices[item.name] || item.min) * multiplier));
  const verb = increase ? "up" : "dropped";
  return `${title}<br>${lead} ${escapeHtml(item.name)} suppliers.<br><br><strong>${escapeHtml(item.name)} prices are ${verb} ${change}%!</strong>`;
}

function finishVisit() {
  if (!game || game.gameOver) return;

  if (game.visits >= game.maxVisits) {
    if (game.day >= game.gameLength) {
      endGame("You reached the end of the game.");
      return;
    }
    game.day += 1;
    game.visits = 0;
    generateMarket();
    message(`A new day begins: day ${game.day}.`);
  }
  updateGame();
}

function updateGame() {
  renderGame();
  if (settings.autosave) saveGame();
}

function openModal(html) {
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");
  if (!modal || !content) return;
  content.innerHTML = html;
  modal.classList.add("active");
  const firstControl = content.querySelector("button, input, select");
  if (firstControl) firstControl.focus();
}

function closeModal() {
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");
  if (modal) modal.classList.remove("active");
  if (content) content.innerHTML = "";
}

function showStart() {
  populateStartingLocations();
  showScreen("startScreen");
}

function showLeaderboard() {
  renderLeaderboard();
  showScreen("leaderboardScreen");
}

function showHowToPlay() {
  openModal(`<h2>HOW TO PLAY</h2><p>Buy goods at a low price and travel to another city to sell them for a profit.</p><ul><li>You can carry a maximum of 100 items.</li><li>Each city has different prices.</li><li>You have five visits per day.</li><li>Travel uses one visit.</li><li>Deposit money in the bank to protect it from losses.</li><li>Visit the hospital when your health is low.</li><li>The game ends when you complete the selected number of days.</li></ul><button type="button" onclick="closeModal()">CLOSE</button>`);
}

function showSettings() {
  openModal(`<h2>SETTINGS</h2>
    <label><input id="soundSetting" type="checkbox" ${settings.sound ? "checked" : ""} style="width:auto;margin-right:8px;">Enable sound</label><br>
    <label><input id="autosaveSetting" type="checkbox" ${settings.autosave ? "checked" : ""} style="width:auto;margin-right:8px;">Enable autosave</label><br><br>
    <button type="button" onclick="saveSettingsFromModal()">SAVE SETTINGS</button>
    <button type="button" onclick="clearSavedGame()">CLEAR SAVED GAME</button>
    <button type="button" onclick="closeModal()">CLOSE</button>`);
}

function saveSettingsFromModal() {
  const sound = document.getElementById("soundSetting");
  const autosave = document.getElementById("autosaveSetting");
  settings.sound = !!sound?.checked;
  settings.autosave = !!autosave?.checked;
  storageSet(SETTINGS_KEY, JSON.stringify(settings));
  closeModal();
  message("Settings saved.");
}

function loadSettings() {
  try {
    return { sound: true, autosave: true, ...JSON.parse(storageGet(SETTINGS_KEY, "{}")) };
  } catch {
    return { sound: true, autosave: true };
  }
}

function populateStartingLocations() {
  const select = document.getElementById("startingLocation");
  if (!select || select.options.length) return;
  LOCATIONS.forEach((location, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = `${location.city}, ${location.country}`;
    select.appendChild(option);
  });
}

function startGame() {
  const nameInput = document.getElementById("playerName");
  const lengthInput = document.getElementById("gameLength");
  const locationInput = document.getElementById("startingLocation");
  const username = nameInput.value.trim();
  const length = Number(lengthInput.value);
  const locationIndex = Number(locationInput.value);
  const selectedLocation = LOCATIONS[locationIndex];

  if (!username) {
    alert("Please enter a player name.");
    nameInput.focus();
    return;
  }
  if (!Number.isInteger(length) || length < 1) return alert("Please select a valid game length.");
  if (!selectedLocation) return alert("Please select a starting location.");

  game = newGameState(username, length, createLocation(selectedLocation));
  generateMarket();
  showScreen("gameScreen");
  message(`Welcome, ${escapeHtml(game.username)}. You are starting in ${escapeHtml(locationName(game.location))}.`);
  updateGame();
}

function renderGame() {
  if (!game) return;
  const fields = {
    statLocation: locationName(game.location),
    statDay: `${game.day} / ${game.gameLength}`,
    statVisits: `${game.visits} / ${game.maxVisits}`,
    statCash: money(game.cash),
    statBank: money(game.bank),
    statHealth: `${Math.max(0, game.health)}%`,
    statCapacity: `${getInventoryTotal()} / ${game.capacity}`
  };
  Object.entries(fields).forEach(([id, value]) => {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  });
  renderMarket();
}

function openBank() {
  if (!game || game.gameOver) return;
  openModal(`<h2>BANK</h2><div class="bank-amount">Current balance: ${money(game.bank)}</div><label>Amount</label><input id="bankAmount" type="number" min="1" step="1" placeholder="Enter amount"><button type="button" onclick="depositMoney()">DEPOSIT</button><button type="button" onclick="withdrawMoney()">WITHDRAW</button><button type="button" onclick="closeModal()">CLOSE</button>`);
}

function getBankAmount() {
  const input = document.getElementById("bankAmount");
  const amount = Number(input?.value);
  return Number.isFinite(amount) && amount > 0 ? Math.floor(amount) : 0;
}

function depositMoney() {
  const amount = getBankAmount();
  if (!amount) return message("Enter a valid deposit amount.");
  if (amount > game.cash) return message("You do not have enough cash.");
  game.cash -= amount;
  game.bank += amount;
  closeModal();
  message(`You deposited ${money(amount)}.`);
  updateGame();
}

function withdrawMoney() {
  const amount = getBankAmount();
  if (!amount) return message("Enter a valid withdrawal amount.");
  if (amount > game.bank) return message("You do not have enough money in the bank.");
  game.bank -= amount;
  game.cash += amount;
  closeModal();
  message(`You withdrew ${money(amount)}.`);
  updateGame();
}

function openHospital() {
  if (!game || game.gameOver) return;
  const cost = Math.max(100, (100 - game.health) * 25);
  openModal(`<h2>HOSPITAL</h2><p>Health: <strong>${game.health}%</strong></p><p>Full treatment cost: <strong>${money(cost)}</strong></p><button type="button" onclick="healPlayer()">GET TREATMENT</button><button type="button" onclick="closeModal()">CLOSE</button>`);
}

function healPlayer() {
  if (!game || game.gameOver) return;
  if (game.health >= 100) return message("You are already at full health.");
  const cost = Math.max(100, (100 - game.health) * 25);
  if (game.cash < cost) return message("You cannot afford hospital treatment.");
  game.cash -= cost;
  game.health = 100;
  closeModal();
  message(`Treatment complete. You paid ${money(cost)}.`);
  updateGame();
}

function calculateScore() {
  if (!game) return 0;
  return Math.max(0, Math.floor(game.cash + game.bank + getInventoryValue()));
}

function getInventoryValue() {
  if (!game) return 0;
  return Object.entries(game.inventory || {}).reduce((total, [itemName, quantity]) => total + (game.prices[itemName] || 0) * (Number(quantity) || 0), 0);
}

function endGame(reason = "Game over.") {
  if (!game || game.gameOver) return;
  game.gameOver = true;
  const score = calculateScore();
  addLeaderboardEntry({ name: game.username, score, day: game.day, location: locationName(game.location), date: new Date().toISOString() });
  storageRemove(SAVED_GAME_KEY);
  openModal(`<h2>GAME OVER</h2><p>${escapeHtml(reason)}</p><p>Final cash: <strong>${money(game.cash)}</strong></p><p>Bank balance: <strong>${money(game.bank)}</strong></p><p>Final score: <strong>${money(score)}</strong></p><button type="button" onclick="closeModal(); showLeaderboard();">VIEW LEADERBOARD</button><button type="button" onclick="closeModal(); showScreen('menuScreen'); renderTopTen();">MAIN MENU</button>`);
}

function loadLeaderboard() {
  try {
    const scores = JSON.parse(storageGet(LEADERBOARD_KEY, "[]"));
    return Array.isArray(scores) ? scores : [];
  } catch { return []; }
}

function saveLeaderboard(scores) {
  storageSet(LEADERBOARD_KEY, JSON.stringify(scores));
}

function addLeaderboardEntry(entry) {
  const scores = loadLeaderboard();
  scores.push(entry);
  scores.sort((a, b) => Number(b.score) - Number(a.score));
  saveLeaderboard(scores.slice(0, 100));
}

function renderLeaderboard() {
  const container = document.getElementById("leaderboardRows");
  if (!container) return;
  const scores = loadLeaderboard();
  if (!scores.length) {
    container.innerHTML = `<p style="text-align:center;color:#aaa;">No scores recorded yet.</p>`;
    return;
  }
  container.innerHTML = `<div class="score-row"><b>#</b><b>PLAYER</b><b>SCORE</b></div>`;
  scores.forEach((entry, index) => {
    const row = document.createElement("div");
    row.className = "score-row";
    row.innerHTML = `<span>${index + 1}</span><span>${escapeHtml(entry.name)}</span><strong>${money(entry.score)}</strong>`;
    container.appendChild(row);
  });
}

function renderTopTen() {
  const container = document.getElementById("top10");
  if (!container) return;
  const scores = loadLeaderboard().slice(0, 10);
  container.innerHTML = `<div class="score-row"><b>#</b><b>PLAYER</b><b>SCORE</b></div>`;
  if (!scores.length) {
    container.innerHTML += `<div style="padding:12px;color:#aaa;text-align:center;">No scores recorded yet.</div>`;
    return;
  }
  scores.forEach((entry, index) => {
    container.innerHTML += `<div class="score-row"><span>${index + 1}</span><span>${escapeHtml(entry.name)}</span><strong>${money(entry.score)}</strong></div>`;
  });
}

function saveGame() {
  if (!game || game.gameOver) return;
  storageSet(SAVED_GAME_KEY, JSON.stringify(game));
}

function loadSavedGame() {
  try {
    const saved = JSON.parse(storageGet(SAVED_GAME_KEY, "null"));
    if (!saved || saved.gameOver || !saved.location) return null;
    return saved;
  } catch { return null; }
}

function continueSavedGame() {
  const saved = loadSavedGame();
  if (!saved) {
    closeModal();
    message("There is no saved game.");
    return;
  }
  game = saved;
  closeModal();
  showScreen("gameScreen");
  renderGame();
  message("Saved game loaded.");
}

function clearSavedGame() {
  storageRemove(SAVED_GAME_KEY);
  closeModal();
  message("Saved game cleared.");
}

document.addEventListener("click", event => {
  if (event.target?.id === "modal") closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

document.addEventListener("DOMContentLoaded", () => {
  populateStartingLocations();
  renderTopTen();
  const savedGame = loadSavedGame();
  const menu = document.querySelector("#menuScreen .menu");
  if (savedGame && menu && !document.getElementById("continueButton")) {
    const button = document.createElement("button");
    button.id = "continueButton";
    button.textContent = "CONTINUE SAVED GAME";
    button.onclick = continueSavedGame;
    const playButton = menu.querySelector('button[onclick="showStart()"]');
    if (playButton) menu.insertBefore(button, playButton);
    else menu.appendChild(button);
  }
});

</script>

</body>
</html>
